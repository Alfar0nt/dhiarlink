server {
    listen 80 default_server;
    server_name dhiarlink.local;
    root /home/dhiarlink/www/public;
    index index.php;

    charset utf-8;
    error_log /home/dhiarlink/www/data/infra/nginx/dhiarlink.error.log;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        root /home/dhiarlink/www/public;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass dhiarlink_php:9000;
        fastcgi_index index.php;
        include fastcgi.conf;
    }
}
