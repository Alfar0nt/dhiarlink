; ============================================================
; Dhiarlink - Development PHP Configuration
; ============================================================
; Used by RoadRunner / FrankenPHP dev Dockerfiles.
; Optimized for developer experience + fast feedback loops.
; ============================================================

; --- Error Handling (verbose for development) ---------------
display_errors=On
display_startup_errors=On
log_errors=On
log_errors_max_len=0
error_reporting=E_ALL

; --- Assertions (verbose for debugging) ---------------------
; 1 = Generate and evaluate assertions in dev
zend.assertions=1
assert.exception=1

; --- OPcache (enabled but with timestamp validation) --------
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
; Validate timestamps so file changes are picked up immediately
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.interned_strings_buffer=8
opcache.save_comments=1

; --- Memory & Execution Limits (generous for dev) -----------
memory_limit=512M
max_execution_time=120
max_input_time=120
post_max_size=50M
upload_max_filesize=50M

; --- Xdebug-friendly settings --------------------------------
; (Xdebug is installed in dev Dockerfiles)

; --- Realpath Cache -----------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600
