# shlink-web-client dashboard — nginx SPA config
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively (they have content hashes)
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all non-file requests serve index.html
    # The React router handles client-side navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers (basic — main security headers come from Dhiarlink for API)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
}
