; ============================================================
; Dhiarlink - Production PHP Configuration
; ============================================================
; This file is copied into the production Docker image and
; overrides the default php.ini for optimal production use.
; ============================================================

; --- Error Handling (production-safe) -----------------------
log_errors_max_len=0
display_errors=Off
display_startup_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Assertions (disabled in production) --------------------
; -1 = Do not generate assertion code at all (zero overhead)
; Prevents internal detail leakage from failed assertions
zend.assertions=-1
assert.exception=0

; --- OPcache (critical for PHP performance) -----------------
; Enable OPcache for compiled bytecode caching
opcache.enable=1
opcache.enable_cli=1

; Memory allocated for cached compiled scripts (MB)
opcache.memory_consumption=256

; Maximum number of cached scripts
opcache.max_accelerated_files=20000

; Do NOT check file timestamps in production (huge perf gain)
; Containers are immutable so files never change at runtime
opcache.validate_timestamps=0

; Preload optimization for frequently used files
opcache.interned_strings_buffer=16

; Save memory by not storing comments in opcache
opcache.save_comments=1

; Fast shutdown for faster request teardown
opcache.fast_shutdown=1

; --- Memory & Execution Limits -----------------------------
memory_limit=256M
max_execution_time=30
max_input_time=30
post_max_size=10M
upload_max_filesize=10M

; --- Session Security ---------------------------------------
session.cookie_httponly=1
session.cookie_secure=1
session.cookie_samesite=Lax
session.use_strict_mode=1

; --- Realpath Cache (reduces filesystem syscalls) -----------
realpath_cache_size=4096K
realpath_cache_ttl=600

; --- APCu (in-process metadata cache) ----------------------
apc.enabled=1
apc.enable_cli=1
apc.shm_size=64M
apc.entries_hint=10000
apc.ttl=7200
