<!DOCTYPE html>
<html lang="en">
    <head>
        <title>404 — Not Found | Dhiarlink</title>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <style>
            :root {
                --bg: #0f1419;
                --bg-card: #192028;
                --accent: #4a9a8e;
                --accent-hover: #5cc4b3;
                --text: #a8b2c1;
                --text-bright: #d4dce8;
                --text-muted: #6b7a8d;
                --border: #2a3440;
                --error: #f87171;
                --font-mono: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", "Consolas", monospace;
            }
            *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
            html { height: 100%; }
            body {
                min-height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-flow: column;
                background: var(--bg);
                color: var(--text);
                font-family: var(--font-mono);
                font-size: 1rem;
                line-height: 1.6;
                text-align: center;
                padding: 2rem 1rem;
                -webkit-font-smoothing: antialiased;
            }
            .terminal-window {
                background: var(--bg-card);
                border: 1px solid var(--border);
                border-radius: 10px;
                width: 100%;
                max-width: 600px;
                overflow: hidden;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            }
            .terminal-bar {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 12px 16px;
                background: rgba(0, 0, 0, 0.3);
                border-bottom: 1px solid var(--border);
            }
            .terminal-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
            }
            .terminal-dot--red { background: #f87171; }
            .terminal-dot--yellow { background: #fbbf24; }
            .terminal-dot--green { background: #4ade80; }
            .terminal-title {
                flex: 1;
                text-align: center;
                font-size: 0.75rem;
                color: var(--text-muted);
                letter-spacing: 0.5px;
            }
            .terminal-body {
                padding: 2.5rem 2rem;
            }
            .error-code {
                font-size: 4rem;
                font-weight: 700;
                color: var(--error);
                line-height: 1;
                margin-bottom: 0.5rem;
                letter-spacing: -2px;
            }
            .prompt {
                color: var(--accent);
                font-size: 0.875rem;
                margin-bottom: 1.5rem;
            }
            .prompt::before { content: "> "; font-weight: 700; }
            .cursor::after {
                content: "█";
                color: var(--accent);
                animation: blink 1s step-end infinite;
                margin-left: 2px;
            }
            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
            .divider {
                border: 0;
                border-top: 1px solid var(--border);
                margin: 1.5rem auto;
                width: 80%;
            }
            .message {
                color: var(--text-muted);
                font-size: 0.875rem;
                margin-bottom: 2rem;
            }
            .btn-home {
                display: inline-block;
                padding: 0.5rem 1.5rem;
                background: transparent;
                color: var(--accent);
                border: 1px solid var(--accent);
                border-radius: 6px;
                font-family: var(--font-mono);
                font-size: 0.875rem;
                text-decoration: none;
                transition: all 0.2s ease;
                cursor: pointer;
            }
            .btn-home:hover, .btn-home:focus-visible {
                background: rgba(74, 154, 142, 0.15);
                color: var(--accent-hover);
                border-color: var(--accent-hover);
                box-shadow: 0 0 20px rgba(74, 154, 142, 0.2);
                text-decoration: none;
            }
            .btn-home:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }
            .footer-text {
                margin-top: 2rem;
                font-size: 0.75rem;
                color: var(--text-muted);
                opacity: 0.6;
            }
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 0.01ms !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>
    <body>
        <main class="terminal-window" role="main">
            <div class="terminal-bar" aria-hidden="true">
                <span class="terminal-dot terminal-dot--red"></span>
                <span class="terminal-dot terminal-dot--yellow"></span>
                <span class="terminal-dot terminal-dot--green"></span>
                <span class="terminal-title">dhiarlink — error</span>
            </div>
            <div class="terminal-body">
                <div class="error-code" aria-label="Error 404">404</div>
                <p class="prompt cursor"><span>page_not_found</span></p>
                <hr class="divider">
                <p class="message">The page you requested could not be found.<br>It may have been moved, or never existed.</p>
                <a href="/" class="btn-home" aria-label="Go back to the homepage">cd /home</a>
            </div>
        </main>
        <p class="footer-text">dhiarlink</p>
    </body>
</html>
