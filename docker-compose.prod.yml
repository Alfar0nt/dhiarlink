# ==============================================================================
# Dhiarlink — Production Docker Compose
# ==============================================================================
# 5-service stack: Dhiarlink (RoadRunner), MySQL, Redis, Caddy, Dashboard
#
# Architecture:
#   cloudflared (system service on host) → localhost:3000 (Caddy)
#   Caddy routes by hostname → Dhiarlink or Dashboard
#
# Usage:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
# ==============================================================================

services:

    # --- Dhiarlink Backend (PHP 8.5 + RoadRunner) ---
    dhiarlink:
        container_name: dhiarlink
        build:
            context: .
            dockerfile: Dockerfile
            args:
                DHIARLINK_VERSION: ${DHIARLINK_VERSION:-latest}
                DHIARLINK_RUNTIME: rr
        restart: unless-stopped
        environment:
            APP_ENV: prod
            DHIARLINK_RUNTIME: rr
            DEFAULT_DOMAIN: ${DEFAULT_DOMAIN:-link.dhiarr.qzz.io}
            IS_HTTPS_ENABLED: ${IS_HTTPS_ENABLED:-true}
            DB_DRIVER: ${DB_DRIVER:-mysql}
            DB_HOST: ${DB_HOST:-dhiarlink_db}
            DB_PORT: ${DB_PORT:-3306}
            DB_NAME: ${DB_NAME:-dhiarlink}
            DB_USER: ${DB_USER:-dhiarlink}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
            REDIS_SERVERS: ${REDIS_SERVERS:-tcp://dhiarlink_redis:6379}
            REDIS_PUB_SUB_ENABLED: ${REDIS_PUB_SUB_ENABLED:-true}
            TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
            CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-https://app.dhiarr.qzz.io}
            GEOLITE_LICENSE_KEY: ${GEOLITE_LICENSE_KEY:-}
            INITIAL_API_KEY: ${INITIAL_API_KEY:-}
            WEB_WORKER_NUM: ${WEB_WORKER_NUM:-0}
            TASK_WORKER_NUM: ${TASK_WORKER_NUM:-0}
            LOGS_FORMAT: ${LOGS_FORMAT:-json}
            DHIARLINK_VERSION: ${DHIARLINK_VERSION:-latest}
        depends_on:
            dhiarlink_db:
                condition: service_healthy
            dhiarlink_redis:
                condition: service_healthy
        networks:
            - dhiarlink_internal

    # --- MySQL 8.0 ---
    dhiarlink_db:
        container_name: dhiarlink_db
        image: mysql:8.0
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
            MYSQL_DATABASE: ${DB_NAME:-dhiarlink}
            MYSQL_USER: ${DB_USER:-dhiarlink}
            MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks:
            - dhiarlink_internal

    # --- Redis 7.4 ---
    dhiarlink_redis:
        container_name: dhiarlink_redis
        image: redis:7.4-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - dhiarlink_internal

    # --- Caddy 2 (Reverse Proxy) ---
    # Exposed on host port 3000 for cloudflared (system service)
    dhiarlink_caddy:
        container_name: dhiarlink_caddy
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '3000:80'
        volumes:
            - ./data/infra/Caddyfile:/etc/caddy/Caddyfile:ro
        depends_on:
            - dhiarlink
            - dhiarlink_dashboard
        networks:
            - dhiarlink_internal

    # --- dhiarlink-web-client Dashboard ---
    # Built from the sibling fork at ../dhiarlink-web-client
    dhiarlink_dashboard:
        container_name: dhiarlink_dashboard
        build:
            context: ../dhiarlink-web-client
        restart: unless-stopped
        environment:
            DHIARLINK_SERVER_URL: ${DHIARLINK_SERVER_URL:-https://www.dhiarr.qzz.io}
            DHIARLINK_SERVER_API_KEY: ${DHIARLINK_SERVER_API_KEY:-}
            DHIARLINK_SERVER_NAME: ${DHIARLINK_SERVER_NAME:-Dhiarlink}
            DHIARLINK_SERVER_FORWARD_CREDENTIALS: ${DHIARLINK_SERVER_FORWARD_CREDENTIALS:-false}
        networks:
            - dhiarlink_internal

volumes:
    mysql_data:
    redis_data:

networks:
    dhiarlink_internal:
        driver: bridge
