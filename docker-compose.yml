services:
    dhiarlink_nginx:
        container_name: dhiarlink_nginx
        image: nginx:1.25-alpine
        ports:
            - "8000:80"
        volumes:
            - ./:/home/dhiarlink/www
            - ./docs:/home/dhiarlink/www/public/docs
            - ./data/infra/vhost.conf:/etc/nginx/conf.d/default.conf
        links:
            - dhiarlink_php

    dhiarlink_php:
        container_name: dhiarlink_php
        user: 1000:1000
        build:
            context: .
            dockerfile: ./data/infra/php.Dockerfile
        ports:
            - '8888:8888'
        volumes:
            - ./:/home/dhiarlink/www
            - ./data/infra/php.ini:/usr/local/etc/php/php.ini
        links:
            - dhiarlink_db_mysql
            - dhiarlink_db_postgres
            - dhiarlink_db_maria
            - dhiarlink_db_ms
            - dhiarlink_redis
            - dhiarlink_redis_acl
            - dhiarlink_mercure
            - dhiarlink_mercure_proxy
            - dhiarlink_rabbitmq
            - dhiarlink_matomo
        environment:
            LC_ALL: C
            DEFAULT_DOMAIN: localhost:8000
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    dhiarlink_roadrunner:
        container_name: dhiarlink_roadrunner
        user: 1000:1000
        build:
            context: .
            dockerfile: ./data/infra/roadrunner.Dockerfile
        ports:
            - "8800:8080"
        volumes:
            - ./:/home/dhiarlink
            - ./data/infra/php.ini:/usr/local/etc/php/php.ini
        links:
            - dhiarlink_db_mysql
            - dhiarlink_db_postgres
            - dhiarlink_db_maria
            - dhiarlink_db_ms
            - dhiarlink_redis
            - dhiarlink_redis_acl
            - dhiarlink_mercure
            - dhiarlink_mercure_proxy
            - dhiarlink_rabbitmq
            - dhiarlink_matomo
        environment:
            LC_ALL: C
        extra_hosts:
            - 'host.docker.internal:host-gateway'

    dhiarlink_frankenphp:
      container_name: dhiarlink_frankenphp
      user: 1000:1000
      build:
        context: .
        dockerfile: ./data/infra/frankenphp.Dockerfile
      ports:
        - "8008:8008"
      volumes:
        - ./:/home/dhiarlink
        - ./data/infra/php.ini:/usr/local/etc/php/php.ini
        - ./data/infra/frankenphp_caddy_data:/data
        - ./data/infra/frankenphp_caddy_config:/config
      links:
        - dhiarlink_db_mysql
        - dhiarlink_db_postgres
        - dhiarlink_db_maria
        - dhiarlink_db_ms
        - dhiarlink_redis
        - dhiarlink_redis_acl
        - dhiarlink_mercure
        - dhiarlink_mercure_proxy
        - dhiarlink_rabbitmq
        - dhiarlink_matomo
      environment:
        FRANKENPHP_CONFIG: 'worker /home/dhiarlink/bin/frankenphp-worker.php'
        SERVER_NAME: ':8008 https:8009'
      extra_hosts:
        - 'host.docker.internal:host-gateway'
      tty: true

    dhiarlink_db_mysql:
        container_name: dhiarlink_db_mysql
        user: 1000:1000
        image: mysql:8.0
        ports:
            - "3307:3306"
        volumes:
            - ./:/home/dhiarlink/www
            - ./data/infra/database:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: dhiarlink

    dhiarlink_db_postgres:
        container_name: dhiarlink_db_postgres
        user: 1000:1000
        image: postgres:16.3-alpine
        ports:
            - "5434:5432"
        volumes:
            - ./:/home/dhiarlink/www
            - ./data/infra/database_pg:/var/lib/postgresql/data
        environment:
            POSTGRES_PASSWORD: root
            POSTGRES_DB: dhiarlink
            PGDATA: /var/lib/postgresql/data/pgdata

    dhiarlink_db_maria:
        container_name: dhiarlink_db_maria
        user: 1000:1000
        image: mariadb:12.3
        ports:
            - "3308:3306"
        volumes:
            - ./:/home/dhiarlink/www
            - ./data/infra/database_maria:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: dhiarlink
            MYSQL_INITDB_SKIP_TZINFO: 1

    dhiarlink_db_ms:
        container_name: dhiarlink_db_ms
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
            - "1433:1433"
        environment:
            ACCEPT_EULA: Y
            SA_PASSWORD: "Passw0rd!"

    dhiarlink_redis:
        container_name: dhiarlink_redis
        image: redis:7.4-alpine
        ports:
            - "6380:6379"

    dhiarlink_redis_acl:
        container_name: dhiarlink_redis_acl
        image: redis:7.4-alpine
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        ports:
            - "6382:6379"
        volumes:
            - ./data/infra/redis/redis-acl.conf:/usr/local/etc/redis/redis.conf

    dhiarlink_mercure_proxy:
        container_name: dhiarlink_mercure_proxy
        image: nginx:1.25-alpine
        ports:
            - "8002:80"
        volumes:
            - ./:/home/dhiarlink/www
            - ./data/infra/mercure_proxy_vhost.conf:/etc/nginx/conf.d/default.conf
        links:
            - dhiarlink_mercure

    dhiarlink_mercure:
        container_name: dhiarlink_mercure
        image: dunglas/mercure:v0.18
        ports:
            - "3080:80"
        environment:
            SERVER_NAME: ":80"
            MERCURE_PUBLISHER_JWT_KEY: mercure_jwt_key_long_enough_to_avoid_error
            MERCURE_SUBSCRIBER_JWT_KEY: mercure_jwt_key_long_enough_to_avoid_error
            MERCURE_EXTRA_DIRECTIVES: "cors_origins https://app.dhiarr.qzz.io http://localhost:3000 http://127.0.0.1:3000 http://localhost:3002 http://127.0.0.1:3002 http://localhost:3005 http://127.0.0.1:3005"

    dhiarlink_rabbitmq:
        container_name: dhiarlink_rabbitmq
        image: rabbitmq:3.11-management-alpine
        ports:
            - "15673:15672"
            - "5673:5672"
        environment:
            RABBITMQ_DEFAULT_USER: "rabbit"
            RABBITMQ_DEFAULT_PASS: "rabbit"

    dhiarlink_swagger_ui:
        container_name: dhiarlink_swagger_ui
        image: swaggerapi/swagger-ui:v5.11.3
        ports:
            - "8005:8080"
        volumes:
            - ./docs/swagger:/app
            - ./docs/swagger/swagger-ui-custom.css:/usr/share/nginx/html/swagger-ui-custom.css:ro
        environment:
            # Load custom Dhiarlink terminal-dark-green theme
            SWAGGER_UI_CONFIG: '{"deepLinking": true, "persistAuthorization": true}'

    dhiarlink_matomo:
        container_name: dhiarlink_matomo
        image: matomo:5.0-apache
        ports:
            - "8003:80"
        volumes:
            # Matomo does not persist port in trusted hosts. This volume is needed to edit config afterward
            # https://github.com/matomo-org/matomo/issues/9549
            - ./data/infra/matomo:/var/www/html
        links:
            - dhiarlink_db_mysql
        environment:
            MATOMO_DATABASE_HOST: "dhiarlink_db_mysql"
            MATOMO_DATABASE_ADAPTER: "mysql"
            MATOMO_DATABASE_DBNAME: "matomo"
            MATOMO_DATABASE_USERNAME: "root"
            MATOMO_DATABASE_PASSWORD: "root"
