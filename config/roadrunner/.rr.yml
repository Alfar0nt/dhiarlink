version: '3'

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: 'php -dopcache.enable_cli=1 -dopcache.validate_timestamps=0 ../../bin/roadrunner-worker.php'

http:
  address: '${ADDRESS:-0.0.0.0}:${PORT:-8080}'
  middleware: ['static', 'gzip']
  static:
    dir: '../../public'
    forbid: ['.php', '.htaccess']
  pool:
    num_workers: ${WEB_WORKER_NUM:-0}
    max_jobs: 500 # Restart worker after this many requests to mitigate memory leaks
    supervisor:
      watch_tick: 1s        # How often to check worker state
      ttl: 0                # Maximum worker lifetime (0 = unlimited)
      idle_ttl: 10s         # Restart idle workers after this duration
      max_worker_memory: 128  # Restart worker if memory exceeds 128MB
      exec_ttl: 60s         # Kill worker if a single request takes longer than this

jobs:
  timeout: 300 # 5 minutes
  pool:
    num_workers: ${TASK_WORKER_NUM:-0}
    max_jobs: 500 # Restart worker after this many jobs to mitigate memory leaks
    supervisor:
      watch_tick: 1s
      idle_ttl: 30s
      max_worker_memory: 256
      exec_ttl: 300s
  consume: ['dhiarlink']
  pipelines:
    dhiarlink:
      driver: memory
      config:
        priority: 10
        prefetch: 10

logs:
  encoding: ${LOGS_FORMAT:-console}
  mode: production
  channels:
    http:
      mode: 'off' # Disable logging as Dhiarlink handles it internally
    server:
      encoding: ${LOGS_FORMAT:-console}
      level: info
    jobs:
      encoding: ${LOGS_FORMAT:-console}
      level: debug
