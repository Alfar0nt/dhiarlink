version: '3'

##############################################################################################
# Dhiarlink — Production RoadRunner Configuration
#
# This config is used by:
#   - Docker production image (docker/docker-entrypoint.sh)
#   - Bare metal deployment (systemd service)
#
# Environment variable overrides:
#   WEB_WORKER_NUM   — Number of HTTP workers (0 = auto-detect CPU cores)
#   TASK_WORKER_NUM  — Number of job workers (0 = auto-detect CPU cores)
#   LOGS_FORMAT      — Log format: 'console' (human-readable) or 'json' (structured)
##############################################################################################

rpc:
  listen: tcp://127.0.0.1:6001

server:
  command: 'php ../../bin/roadrunner-worker.php'

http:
  address: '0.0.0.0:8080'
  middleware: ['static']
  max_request_size: 10485760  # 10 MB
  static:
    dir: '../../public'
    forbid: ['.php', '.htaccess']
  pool:
    num_workers: ${WEB_WORKER_NUM:-0}
    max_jobs: 500
    supervisor:
      watch_tick: 1s
      ttl: 0s
      idle_ttl: 10s
      max_worker_memory: 128
      exec_ttl: 60s

jobs:
  pool:
    num_workers: ${TASK_WORKER_NUM:-0}
    max_jobs: 500
    supervisor:
      watch_tick: 1s
      ttl: 0s
      idle_ttl: 10s
      max_worker_memory: 256
      exec_ttl: 300s
  timeout: 300
  consume: ['dhiarlink']
  pipelines:
    dhiarlink:
      driver: memory
      config:
        priority: 10
        prefetch: 100

logs:
  encoding: ${LOGS_FORMAT:-json}
  mode: production
  level: error
  channels:
    http:
      mode: 'off'
    server:
      encoding: ${LOGS_FORMAT:-json}
      level: error
    jobs:
      encoding: ${LOGS_FORMAT:-json}
      level: error
